name: Pages

on:
  push:
    branches:
      - dev
      - master
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != 'cyaris' }}
        run: |
          set -euo pipefail

          printf "Manual dispatch is restricted to cyaris.\n" >&2
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Install npm dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
      - name: Install dependencies
        run: bundle install && bundle exec appraisal install
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Setup CI config
        env:
          PAGES_BASE_PATH: ${{ steps.configure-pages.outputs.base_path }}
        run: |
          set -euo pipefail

          printf "%s\n" "---" > _config_ci.yml
          printf "baseurl: %s\n" "$PAGES_BASE_PATH" >> _config_ci.yml
      - name: Generate GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-github-repo-dates.mjs
      - name: Resolve S3 asset metadata mode
        id: s3-assets
        env:
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLLUP_UPLOAD_ROLE_ARN }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail

          mode="fallback"
          use_access_keys="false"
          use_oidc="false"

          if [[ "$REF_NAME" == "refs/heads/master" || "$EVENT_NAME" == "schedule" ]]; then
            mode="aws"
          fi

          if [[ "$mode" == "aws" ]]; then
            if [[ -n "$AWS_ROLE_TO_ASSUME" ]]; then
              use_oidc="true"
            elif [[ -n "$AWS_ACCESS_KEY_ID_INPUT" && -n "$AWS_SECRET_ACCESS_KEY_INPUT" ]]; then
              use_access_keys="true"
            else
              printf "S3 asset version generation requires AWS_ROLLUP_UPLOAD_ROLE_ARN or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for %s on %s.\n" "$EVENT_NAME" "$REF_NAME" >&2
              exit 1
            fi
          fi

          {
            printf "mode=%s\n" "$mode"
            printf "use_access_keys=%s\n" "$use_access_keys"
            printf "use_oidc=%s\n" "$use_oidc"
          } >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials with OIDC role
        if: steps.s3-assets.outputs.use_oidc == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.AWS_ROLLUP_UPLOAD_ROLE_ARN }}
      - name: Configure AWS credentials with access keys
        if: steps.s3-assets.outputs.use_access_keys == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: us-east-2
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Test S3 asset version generation
        run: npm run test:s3-assets
      - name: Generate S3 asset versions
        env:
          JEKYLL_ENV: production
          S3_ASSET_VERSION_MODE: ${{ steps.s3-assets.outputs.mode }}
        run: npm run update:s3-assets
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --config _config_ci.yml,_config.yml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
