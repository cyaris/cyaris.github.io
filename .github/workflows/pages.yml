name: Pages

on:
  push:
  pull_request:
  schedule:
    - cron: "0 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-time:
    name: Check local schedule time
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.schedule.outputs.should-run }}
    steps:
      - id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$(TZ=America/Chicago date +%H)" == "08" ]]; then
            printf "should-run=true\n" >> "$GITHUB_OUTPUT"
          else
            printf "should-run=false\n" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Jekyll
    needs: local-time
    if: needs.local-time.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
      - name: Install dependencies
        run: bundle install && bundle exec appraisal install
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Setup CI config
        env:
          PAGES_BASE_PATH: ${{ steps.configure-pages.outputs.base_path }}
        run: |
          printf "%s\n" "---" > _config_ci.yml
          printf "baseurl: %s\n" "$PAGES_BASE_PATH" >> _config_ci.yml
      - name: Generate GitHub repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-github-repo-dates.mjs
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec appraisal jekyll build --future --config _config_ci.yml,_config.yml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
