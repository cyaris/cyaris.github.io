<script>
  window.siteThemeDefinitions = Object.freeze({
    defaultTheme: {{ site.default-theme | jsonify }},
    storageKey: {{ site.theme-storage-key | jsonify }},
    themes: Object.freeze({
      {%- for theme_pair in site.theme-palettes %}
        {{ theme_pair[0] | jsonify }}: Object.freeze({
          label: {{ theme_pair[1].label | jsonify }},
          variables: Object.freeze({
            {%- for variable_pair in theme_pair[1].variables %}
              {{ variable_pair[0] | prepend: '--' | jsonify }}: {{ variable_pair[1] | jsonify }}{% unless forloop.last %},{% endunless %}
            {%- endfor %}
          })
        }){% unless forloop.last %},{% endunless %}
      {%- endfor %}
    })
  })
</script>
