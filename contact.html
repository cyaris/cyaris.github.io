---
layout: page
title: Contact
---
<style>
  .contact-form {
    align-self: center;
    width: 100%;
    max-width: 700px;
  }

  .contact-field {
    margin-bottom: 1.25rem;
  }

  .contact-field label {
    display: block;
    margin-bottom: 0.4rem;
    font-weight: 700;
  }

  .contact-field input,
  .contact-field textarea {
    width: 100%;
    padding: 0.8rem 0.9rem;
    color: var(--text-col);
    background-color: var(--page-col);
    border: 2px solid var(--navbar-col);
    border-radius: 10px;
  }

  .contact-field input:focus,
  .contact-field textarea:focus {
    border-color: var(--link-col);
    outline: 3px solid color-mix(in srgb, var(--link-col) 25%, transparent);
  }

  .contact-field textarea {
    resize: vertical;
  }

  .contact-form button {
    display: inline-block;
    padding: 16px 31px;
    color: var(--btn-link-col);
    font-size: 17px;
    font-weight: 750;
    background-color: var(--btn-background-col);
    border: 4.5px solid transparent;
    border-radius: 28px;
    cursor: pointer;
    height: 65px;
    text-decoration: none;
    width: 205px;
  }

  .contact-form button:hover,
  .contact-form button:focus {
    color: var(--btn-link-hover-col);
    background-color: var(--btn-background-hover-col);
    border-color: var(--btn-border-hover-col);
    text-decoration: none;
    font-weight: 750;
  }

  .contact-form button:disabled {
    cursor: wait;
    opacity: 0.7;
  }

  .contact-turnstile {
    width: 100%;
    max-width: 360px;
    margin: 0.35rem 0 1.25rem;
    padding: 0.55rem 0;
    border-radius: 10px;
  }

  .contact-turnstile .cf-turnstile {
    min-width: 0;
  }

  .contact-status {
    min-height: 1.5rem;
    margin-top: 1rem;
    font-weight: 700;
  }

  .contact-status[data-state='success'] {
    color: var(--link-col);
  }

  .contact-status[data-state='error'] {
    color: #c44536;
  }

  .contact-honeypot {
    position: absolute !important;
    left: -9999px !important;
    top: auto !important;
    width: 1px !important;
    height: 1px !important;
    overflow: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

  @media (max-width: 576px) {
    main.container-md:has(.contact-form) {
      padding-right: 1.125rem;
      padding-left: 1.125rem;
    }

    .contact-form {
      max-width: none;
      margin-top: 0.25rem;
      padding: 1.1rem 0 0.4rem;
    }

    .contact-field {
      margin-bottom: 1rem;
    }

    .contact-field label {
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
    }

    .contact-field input,
    .contact-field textarea {
      min-height: 3rem;
      padding: 0.8rem 0.85rem;
      font-size: 1rem;
      line-height: 1.45;
      border-color: color-mix(in srgb, var(--navbar-col) 82%, var(--text-col));
      border-radius: 8px;
      box-shadow: 0 2px 0 color-mix(in srgb, var(--navbar-col) 24%, transparent);
    }

    .contact-field textarea {
      min-height: 11.5rem;
    }

    .contact-turnstile {
      max-width: none;
      margin: 0.3rem 0 1rem;
      padding: 0.5rem;
      border-radius: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .contact-form button {
      display: block;
      margin: 0 auto;
    }

    .contact-status {
      min-height: 1.35rem;
      margin-top: 0.85rem;
      font-size: 0.95rem;
      line-height: 1.45;
      text-align: center;
    }
  }
</style>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<form id="contact-form" class="contact-form">
  <div class="contact-field">
    <label for="contact-name">Name</label>
    <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required>
  </div>
  <div class="contact-field">
    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required>
  </div>
  <div class="contact-field">
    <label for="contact-subject">Subject</label>
    <input id="contact-subject" name="subject" type="text" maxlength="150" required>
  </div>
  <div class="contact-field">
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" rows="8" maxlength="5000" required></textarea>
  </div>
  <div class="contact-honeypot" aria-hidden="true">
    <label for="contact-website">Website</label>
    <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
  </div>
  <div class="contact-turnstile">
    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAADy94v3LKGOnSzTn"
      data-theme="light"
      data-size="flexible"
    ></div>
  </div>
  <button id="contact-submit" type="submit">Send Message</button>
  <p id="contact-status" class="contact-status" role="status" aria-live="polite" hidden></p>
</form>

<script>
  ;(() => {
    const form = document.getElementById('contact-form')
    const button = document.getElementById('contact-submit')
    const status = document.getElementById('contact-status')
    const originalButtonText = button.textContent

    const setStatus = (message = '', state = '') => {
      status.textContent = message
      status.dataset.state = state
      status.hidden = !message
    }
    const resetTurnstile = () => {
      window.turnstile?.reset?.()
    }

    form.addEventListener('submit', async event => {
      event.preventDefault()

      const formData = new FormData(form)
      const turnstileToken = formData.get('cf-turnstile-response')

      if (!turnstileToken) {
        setStatus('Please complete the spam verification.', 'error')
        return
      }

      button.disabled = true
      button.textContent = 'Sending…'
      setStatus()

      try {
        const response = await fetch('https://contact-form-worker.charlieyaris.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: formData.get('name'),
            email: formData.get('email'),
            subject: formData.get('subject'),
            message: formData.get('message'),
            website: formData.get('website'),
            turnstileToken
          })
        })

        const responseText = await response.text()
        let result = {}
        if (responseText) {
          try {
            result = JSON.parse(responseText)
          } catch (error) {
            result = {}
          }
        }

        if (!response.ok) {
          throw new Error(result?.error || responseText || "Sorry, your message couldn't be sent.")
        }

        form.reset()
        resetTurnstile()

        setStatus('Thanks for reaching out!', 'success')
      } catch (error) {
        setStatus(error.message || "Sorry, your message couldn't be sent. Please try again.", 'error')

        resetTurnstile()
      } finally {
        button.disabled = false
        button.textContent = originalButtonText
      }
    })
  })()
</script>
